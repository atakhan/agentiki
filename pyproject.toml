[project]
name = "agentiki"
version = "0.1.0"
description = "Browser evolution simulation: FastAPI control plane + Python sim core"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.10",
]

[project.scripts]
agentiki = "agentiki.server.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
