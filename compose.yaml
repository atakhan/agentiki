services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      AGENTIKI_SEED: "1"
      AGENTIKI_SIM_BACKEND: python
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 8s
